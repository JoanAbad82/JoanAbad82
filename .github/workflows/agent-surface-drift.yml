name: Agent surface drift guard

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "projects.json"
      - "AGENT_INTERACTION.md"
      - "OPEN_RESEARCH_CHALLENGES.md"
      - "schemas/agent-task-contract.schema.json"
      - "schemas/agent-task-index.schema.json"
      - "scripts/agent_surface_drift_guard.py"
      - "tests/test_agent_surface_drift*.py"
      - ".github/workflows/agent-surface-drift.yml"
  push:
    branches:
      - main
    paths:
      - "projects.json"
      - "AGENT_INTERACTION.md"
      - "OPEN_RESEARCH_CHALLENGES.md"
      - "schemas/agent-task-contract.schema.json"
      - "schemas/agent-task-index.schema.json"
      - "scripts/agent_surface_drift_guard.py"
      - "tests/test_agent_surface_drift_guard.py"
      - "tests/test_agent_surface_drift_v11.py"
      - ".github/workflows/agent-surface-drift.yml"

permissions:
  contents: read

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile surface
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1" "rfc3339-validator==0.1.4" "rfc3986-validator==0.1.1"

      - name: Test drift guard offline
        run: python3 -m unittest discover -s tests -p "test_agent_surface_drift*.py" -v

      - name: Validate machine-readable agent surfaces
        id: validate
        run: |
          python3 scripts/agent_surface_drift_guard.py \
            --profile-root . \
            --json-report agent-surface-drift-report.json \
            --evidence-report agent-surface-drift-evidence.json

      - name: Upload drift report
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: agent-surface-drift-report
          path: agent-surface-drift-report.json
          if-no-files-found: error

      - name: Upload structured evidence
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: agent-surface-drift-evidence
          path: agent-surface-drift-evidence.json
          if-no-files-found: error
